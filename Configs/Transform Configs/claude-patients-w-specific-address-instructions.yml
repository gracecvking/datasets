schema_version: "1.0"
name: "claude for patients with specific address instructions"
models:
  - transform_v2:
      globals:
        classify:
          enable: true
          entities:
            - first_name
            - last_name
            - email
            - phone_number
            - address
            - city
            - state
            - postal_code
      steps:
        - rows:
            update:
              - entity: first_name
                value: fake.first_name()
              - entity: last_name
                value: fake.last_name()
              - entity: email
                value: fake.email()
              - entity: phone_number
                value: fake.phone_number()
              - entity: address
                value: fake.street_address()
              - name: state
                value: fake.state()
              - name: city
                value: fake.city_in_state(row.state)
              - name: country
                value: '"United States"'
              - entity: postal_code
                value: fake.postcode_in_state(row.state)
              - name: age
                value: (this | int) + (range(-5, 6) | random)
              - name: last_visit
                value: fake.date_between(start_date='-60d', end_date='today')
              - name: next_visit
                value: fake.date_between(start_date='today', end_date='+60d')
              - name: height
                value: (this | float) + ([-2, -1, 0, 1, 2] | random)
              - name: weight
                value: (this | float) + (range(-10, 11) | random)
              - name: heart_rate
                value: (this | int) + (range(-5, 6) | random)